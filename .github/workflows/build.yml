name: Construir aplicaciones

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: windows-x64
            runner: windows-2022
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Comprobar que el repositorio solo contiene fuentes
        run: python scripts/check_source.py
      - name: Compilar lanzador y crear paquete con sus dependencias
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build.py --target ${{ matrix.target }}
      - name: Ejecutar las pruebas con FFmpeg incluido
        run: python scripts/test.py --target ${{ matrix.target }}
      - name: Probar el paquete completo y su limpieza al cerrar
        run: python scripts/smoke.py --target ${{ matrix.target }}
      - name: Guardar paquete y comprobaciones
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NotebookLM-Studio-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publicar versión etiquetada
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verificar que la etiqueta coincide con VERSION
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: test "$TAG_NAME" = "v$(cat VERSION)"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-files
          merge-multiple: true
      - name: Publicar los cuatro paquetes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG_NAME" release-files/* --verify-tag --title "NotebookLM Studio $TAG_NAME" --generate-notes
